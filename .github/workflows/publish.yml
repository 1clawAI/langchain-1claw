name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's OIDC token, so no
      # API token is stored here. The publisher must be registered on PyPI
      # for this repository and workflow filename before the first run.
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/langchain-1claw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: pip install build

      - name: Build
        run: python -m build

      - name: Check the artifacts before uploading
        run: |
          pip install twine
          twine check dist/*

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
