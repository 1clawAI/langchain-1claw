name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's OIDC token, so no
      # API token is stored here. The publisher must be registered on PyPI
      # for this repository and workflow filename before the first run.
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/langchain-1claw
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: pip install build

      - name: Build
        run: python -m build

      - name: Check the artifacts before uploading
        run: |
          pip install twine
          twine check dist/*


      - name: Refuse to publish a version that is already on PyPI
        run: |
          VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if curl -sf "https://pypi.org/pypi/langchain-1claw/$VERSION/json" >/dev/null 2>&1; then
            echo "langchain-1claw $VERSION is already published. Bump the version in pyproject.toml."
            exit 1
          fi
          echo "langchain-1claw $VERSION is not on PyPI yet."
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
